    <!-- Anti-Netlify Promo Badge / HUD Suppressor -->
    <script>
      (function() {
        const killNetlifyHud = function() {
          const els = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[title*="Netlify"], iframe[title*="Powered by Netlify"], script[src*="/.netlify/scripts/hud"]');
          for (var i = 0; i < els.length; i++) {
            els[i].remove();
          }
        };
        try {
          const obs = new MutationObserver(killNetlifyHud);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        } catch (e) {}
        window.addEventListener('DOMContentLoaded', killNetlifyHud);
        window.addEventListener('load', killNetlifyHud);
      })();
    </script>
